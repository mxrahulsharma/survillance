# Apache site for OfficeEye when the server already runs Apache (PROXY=apache).
# deploy/vps_install.sh fills in __DOMAIN__ / __APP_PORT__ and installs it as
# /etc/apache2/sites-available/<DOMAIN>.conf; certbot --apache then adds https.
<VirtualHost *:80>
    ServerName __DOMAIN__

    ProxyPreserveHost On
    ProxyRequests Off
    # flushpackets: live camera views are a never-ending stream - pass each frame on at once
    ProxyPass        / http://127.0.0.1:__APP_PORT__/ flushpackets=on timeout=300
    ProxyPassReverse / http://127.0.0.1:__APP_PORT__/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ErrorLog  ${APACHE_LOG_DIR}/__DOMAIN__-error.log
    CustomLog ${APACHE_LOG_DIR}/__DOMAIN__-access.log combined
</VirtualHost>
